<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MUD Client</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #1e1e1e;
      color: #d4d4d4;
      font-family: var(--font-family, "Menlo", "Monaco", "Consolas", monospace);
    }
  </style>
</head>
<body>
  <!-- Drag region available immediately, before JS initializes -->
  <div id="drag-region" data-tauri-drag-region style="
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    height: 38px;
    z-index: 99999;
    -webkit-app-region: drag;
    pointer-events: auto;
  "></div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
